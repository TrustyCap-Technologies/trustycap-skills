name: Check skills
# The gate runs on every push and once a day. The daily run is the point: these skills route an
# agent to live TrustyCap surfaces, and a surface that changes shape without this repository
# changing is exactly the failure a push-triggered check cannot see.
on:
  push:
  pull_request:
  schedule:
    - cron: "17 7 * * *"
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: node scripts/check-skills.mjs --live
